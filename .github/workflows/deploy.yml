name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: launchpad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet restore LaunchPad.sln
      - run: dotnet format LaunchPad.sln --verify-no-changes
      - run: dotnet build LaunchPad.sln -c Release --no-restore
      # Domain/Application tests are pure and unit-tested (no DB); Api.IntegrationTests
      # runs against an in-memory DbContext + fake auth scheme — see tests/LaunchPad.Api.IntegrationTests.
      - run: dotnet test LaunchPad.sln -c Release --no-build --collect:"XPlat Code Coverage"
      - run: dotnet publish src/LaunchPad.Api -c Release -o ./publish/api
      - run: dotnet publish src/LaunchPad.Functions -c Release -o ./publish/functions
      # The schema change this build expects, as an idempotent script (each migration guarded by
      # its own IF NOT EXISTS on __EFMigrationsHistory, so re-running it is a no-op). Generated
      # here because it needs no database at all — applying it does, and this runner cannot
      # reach one: SQL is private-endpoint-only in every environment and public network access
      # is denied tenant-wide by policy (infra/modules/sql.bicep). See docs/runbooks/migrations.md.
      - run: dotnet tool restore
      - run: >-
          dotnet ef migrations script --idempotent
          --project src/LaunchPad.Infrastructure --startup-project src/LaunchPad.Api
          --output ./publish/migrations.sql
      - uses: actions/upload-artifact@v4
        with: { name: api, path: ./publish/api }
      - uses: actions/upload-artifact@v4
        with: { name: functions, path: ./publish/functions }
      - uses: actions/upload-artifact@v4
        with: { name: migrations, path: ./publish/migrations.sql }

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: src/LaunchPad.Web/package-lock.json }
      - run: npm ci --prefix src/LaunchPad.Web
      # Fails on high and critical only, matching Directory.Build.props for the .NET side.
      # The report still lists low and moderate findings; they just don't block a deploy,
      # since a new advisory in a build-time dependency arrives on its publisher's schedule.
      - run: npm audit --prefix src/LaunchPad.Web --audit-level=high
      - run: npm run lint --prefix src/LaunchPad.Web
      - run: npm run test --prefix src/LaunchPad.Web
      - run: npm run build --prefix src/LaunchPad.Web
      - uses: actions/upload-artifact@v4
        with: { name: web, path: src/LaunchPad.Web/dist }

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/cli@v3
        with:
          inlineScript: az bicep build --file infra/main.bicep

  # Runs SqlServerOnlyBehaviorTests.cs against a real SQL Server service container —
  # the one tier of coverage build-api's in-memory-DbContext tests structurally can't
  # provide (the filtered unique index on Assignment, and the vCandidateRisk view).
  # Same idea as the local Tier-1 homelab setup (docker-compose.homelab.yml /
  # scripts/run-local-full.sh), but using the amd64 mssql/server image to match this
  # runner's architecture instead of arm64 azure-sql-edge. Independent of build-api, but
  # now in both deploy jobs' `needs`: it is the only gate that can catch a regression in
  # the filtered unique index or the views, so a deploy that skips it is a deploy with no
  # coverage of the constraints the data model actually relies on.
  integration-real-sql:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: LaunchPad_Ci_2026! # throwaway — container is ephemeral per run, never reachable outside this job
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - run: dotnet restore LaunchPad.sln
      - run: dotnet tool restore
      - run: dotnet build LaunchPad.sln -c Release --no-restore
      - name: Apply migrations to the SQL Server service container
        env:
          ConnectionStrings__Sql: Server=localhost,1433;Database=launchpad;User Id=sa;Password=LaunchPad_Ci_2026!;TrustServerCertificate=True;Encrypt=True;
        run: dotnet ef database update --project src/LaunchPad.Infrastructure --startup-project src/LaunchPad.Api
      - name: Run SQL-Server-only behavior tests
        env:
          SQLSERVER_TEST_CONNECTION: Server=localhost,1433;Database=launchpad;User Id=sa;Password=LaunchPad_Ci_2026!;TrustServerCertificate=True;Encrypt=True;
        run: dotnet test tests/LaunchPad.Api.IntegrationTests -c Release --no-build --filter "FullyQualifiedName~SqlServerOnlyBehaviorTests"

  deploy-dev:
    permissions:
      contents: read
      id-token: write
    needs: [build-api, build-web, validate-infra, integration-real-sql]
    if: github.ref == 'refs/heads/main'
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an operational alert recipient
        env:
          ALERT_EMAIL: ${{ vars.AZURE_ALERT_EMAIL }}
        run: test -n "$ALERT_EMAIL"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2 # infra first, idempotent
        id: infra
        with:
          resourceGroupName: rg-launchpad-dev
          template: infra/main.bicep
          parameters: infra/params.dev.json alertEmail=${{ vars.AZURE_ALERT_EMAIL }}
      - uses: actions/download-artifact@v4
        with: { name: api, path: ./publish/api }
      # Migrations are NOT applied from here. This step used to run `dotnet ef database update`
      # with no connection string configured, against a server this runner cannot reach
      # (publicNetworkAccess: 'Disabled', denied tenant-wide by policy) — it could only ever
      # fail. The schema change ships as the `migrations` artifact instead; an operator applies
      # it from inside the VNet. See docs/runbooks/migrations.md.
      - uses: azure/webapps-deploy@v3
        with:
          # Not a literal name — main.bicep computes it from uniqueString(subscription().id,
          # resourceGroup().id), so it can't be hardcoded here. Read it back from this run's
          # own infra deployment instead (azure/arm-deploy exposes every Bicep `output` as a
          # step output of the same name).
          app-name: ${{ steps.infra.outputs.appServiceName }}
          package: ./publish/api
      - uses: actions/download-artifact@v4
        with: { name: functions, path: ./publish/functions }
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.functionAppName }}
          package: ./publish/functions
      - uses: actions/download-artifact@v4
        with: { name: web, path: ./dist }
      - uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_DEV }}
          app_location: ./dist
          skip_app_build: true

  deploy-prod:
    permissions:
      contents: read
      id-token: write
    needs: [build-api, build-web, validate-infra, integration-real-sql]
    if: github.ref == 'refs/heads/main'
    environment: production # required reviewers gate here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an operational alert recipient
        env:
          ALERT_EMAIL: ${{ vars.AZURE_ALERT_EMAIL }}
        run: test -n "$ALERT_EMAIL"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/arm-deploy@v2 # infra first, idempotent
        id: infra
        with:
          resourceGroupName: rg-launchpad-prod
          template: infra/main.bicep
          parameters: infra/params.prod.json alertEmail=${{ vars.AZURE_ALERT_EMAIL }}
      - uses: actions/download-artifact@v4
        with: { name: api, path: ./publish/api }
      # Not applied from here — same reason as deploy-dev. Prod is the case that matters most:
      # apply the `migrations` artifact from inside the VNet BEFORE approving this deploy, or
      # the new build meets a schema it doesn't expect. See docs/runbooks/migrations.md.
      - uses: azure/webapps-deploy@v3
        with:
          # Same reasoning as deploy-dev — not a literal name, read back from this run's
          # own infra deployment output rather than hardcoded.
          app-name: ${{ steps.infra.outputs.appServiceName }}
          slot-name: staging
          package: ./publish/api
      - run: ./scripts/smoke-test.sh https://${{ steps.infra.outputs.appServiceName }}-staging.azurewebsites.net
      - run: az webapp deployment slot swap -g rg-launchpad-prod -n ${{ steps.infra.outputs.appServiceName }} --slot staging
      - uses: actions/download-artifact@v4
        with: { name: functions, path: ./publish/functions }
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ steps.infra.outputs.functionAppName }}
          package: ./publish/functions
      - uses: actions/download-artifact@v4
        with: { name: web, path: ./dist }
      - uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN_PROD }}
          app_location: ./dist
          skip_app_build: true
