<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Raster rather than SVG: the supplied logo is an SVG wrapper around embedded
         PNGs, so it carries no vector benefit at ~290KB. These are the rocket mark
         alone (no exhaust trail) — the full logo turns to mush below ~48px. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LaunchPad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
